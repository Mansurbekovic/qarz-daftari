services:
  # ---------------- BACKEND WEB SERVICE (PYTHON FLASK) ---------------- #
  - type: web
    name: qarz-daftari-api
    runtime: python
    rootDir: backend
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_DEBUG
        value: "false"

  # ---------------- FRONTEND STATIC SITE (REACT + VITE) ---------------- #
  - type: web
    name: qarz-daftari-web
    runtime: static
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: qarz-daftari-api
          property: host
