services:
  # ---------------- FRONTEND STATIC SITE (REACT + VITE) ---------------- #
  - type: static
    name: qarz-daftari-web
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.12.0

  # ---------------- BACKEND WEB SERVICE (PYTHON FLASK) ---------------- #
  - type: web
    name: qarz-daftari-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_DEBUG
        value: "false"
